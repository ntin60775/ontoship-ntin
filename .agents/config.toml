# OntoShip role registry.
# One [agents.<name>] section per role; `model` is required.
# Routes are the standard layout of dsh-adaptation decision 5 (ask
# 2026-11-09, amendments 2026-11-09 and 2026-11-10): all six roles run on
# the `qwen-token-plan` provider — the four reviewers and the curator on
# qwen3.8-flash with `xhigh`, the critic on qwen3.8-max with `medium`.
# `init` delivers the same layout to a fresh project when every route and
# level is live. A ZCode project gets its own config from `init`
# (ListModels).
# The critic model is recommended to differ from the session model; a match
# is allowed and marked in the report (decision 10, recommendation since
# 2026-11-09).
# A level value is a bare token: letters, digits, '.', '_', '-'.
# DSH: `level` is the role's reasoning_effort, passed straight to `subagent`;
# with the key absent the model default applies and the report marks it, while
# `init` in a fresh project writes the maximum available level.
# ZCode: the generator writes `level` as `thoughtLevel:` into the role
# definition; with the key absent the launch-time check falls back to the
# maximum available (onto-doc decisions 3 and 4) — the generator only omits
# the line.

[agents.reviewer-spec]
model = "qwen-token-plan/qwen3.8-flash"
level = "xhigh"

[agents.reviewer-tests]
model = "qwen-token-plan/qwen3.8-flash"
level = "xhigh"

[agents.reviewer-code]
model = "qwen-token-plan/qwen3.8-flash"
level = "xhigh"

[agents.reviewer-kb]
model = "qwen-token-plan/qwen3.8-flash"
level = "xhigh"

[agents.critic]
model = "qwen-token-plan/qwen3.8-max"
level = "medium"

[agents.curator]
model = "qwen-token-plan/qwen3.8-flash"
level = "xhigh"
