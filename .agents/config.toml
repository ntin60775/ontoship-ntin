# OntoShip role registry.
# One [agents.<name>] section per role; `model` is required, `level` is the
# role's reasoning effort passed straight to `subagent`. With the key absent
# the model default applies.

[agents.reviewer-spec]
model = "qwen-token-plan-max/qwen4-max"
level = "medium"

[agents.reviewer-tests]
model = "qwen-token-plan-max/qwen4-max"
level = "medium"

[agents.reviewer-code]
model = "qwen-token-plan-max/qwen4-max"
level = "medium"

[agents.reviewer-kb]
model = "qwen-token-plan-max/qwen4-max"
level = "medium"

[agents.critic]
model = "qwen-token-plan-max/qwen4-max"
level = "xhigh"

[agents.curator]
model = "qwen-token-plan-deepseek/deepseek-v4.1-flash-1017"
level = "low"

# Projection-validation pool: the critic assigns one distinct route per
# consilium member and records the reason in the gate report.
[validation]
pool = [
  { model = "qwen-token-plan-deepseek/deepseek-v4.1-flash-1017", level = "max" },
  { model = "qwen-token-plan/qwen3.8-flash", level = "xhigh" },
  { model = "qwen-token-plan-glm/glm-5.3", level = "max" },
]
